name: Pubblica Run Map su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepara il sito statico
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
